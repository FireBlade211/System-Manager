<H1>Debugging Plugins</H1>

<P>You may want to debug your plugin to fix issues. To debug plugins:</P>

<OL>
<LI>Make sure your plugin is <A HREF="sideloading.htm">sideloaded</A> with symbols.</LI>
<LI>Run <B>System Manager</B> and attach it to a debugger.</LI>
<LI>Verify that your plugin is loaded.</LI>
<LI>Navigate to the page you want to debug.</LI>
</OL>
